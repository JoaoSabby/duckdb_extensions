name: Sync DuckDB Extensions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated binaries to the default branch
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/sync_extensions.yml', '.github/scripts/sync_extensions.py']
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: duckdb-extension-mirror
  cancel-in-progress: false

jobs:
  mirror-extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DUCKDB_VERSION: v2.0.0
      PLATFORM: linux_amd64
      CORE_EXTENSIONS: encodings httpfs iceberg ui excel fts autocomplete
      COMMUNITY_EXTENSIONS: infera markdown mlpack nanoarrow pdf quackiso rapidfuzz read_lines semantic_layer semantic_profile semantic_views secret_vault sheetreader sitting_duck stats_duck stochastic units cardinal compression_fs cronjob dash databricks duck_lineage finetype fuzzycomplete yaml dq oracle
      QUERY_FARM_EXTENSIONS: json_schema
      NEUESQL_EXTENSIONS: talib
      CATALOG_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover, validate and optionally publish extension binaries
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish) }}
        run: python3 .github/scripts/sync_extensions.py

      - name: Update existing raw URLs for yaml and dq
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish)
        run: |
          # Add only the compatibility binaries already checked into the repository
          git add -u -- \
            "${DUCKDB_VERSION}/${PLATFORM}/yaml.duckdb_extension.gz" \
            "${DUCKDB_VERSION}/${PLATFORM}/dq.duckdb_extension.gz"

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: refresh yaml and dq mirror binaries"
          git push origin "HEAD:${GITHUB_REF}"

