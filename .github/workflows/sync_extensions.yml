name: Sync DuckDB Community Extensions

on:
  workflow_dispatch: # Permite executar manualmente com um clique na aba Actions
  schedule:
    - cron: '0 3 * * 0' # Sincroniza semanalmente aos domingos

permissions:
  contents: write

jobs:
  mirror-extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download extensions from DuckDB repository
        run: |
          DUCKDB_VERSION="v2.0.0"
          PLATFORM="linux_amd64"
          EXTENSIONS=("yaml" "dq")

          mkdir -p "${DUCKDB_VERSION}/${PLATFORM}"

          for EXT in "${EXTENSIONS[@]}"; do
            URL="http://community-extensions.duckdb.org/${DUCKDB_VERSION}/${PLATFORM}/${EXT}.duckdb_extension.gz"
            DEST="${DUCKDB_VERSION}/${PLATFORM}/${EXT}.duckdb_extension.gz"
            echo "Baixando ${URL}..."
            curl -fsSL "${URL}" -o "${DEST}"
          done

      - name: Commit and push binaries to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync DuckDB extensions binaries"
          git push
